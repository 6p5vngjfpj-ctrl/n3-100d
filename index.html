<section class="hero"><span class="badge">N3 · 100 Day</span><h1>N3-100d 完整學習系統</h1><p>100 天 × 每日 10 單字、10 例句、生字卡、發音、文法、測驗與進度</p><div class="stats"><div class="stat">目前<b id="hday">Day 1</b></div><div class="stat">完成<b id="hdone">0 / 100</b></div><div class="stat">已掌握生字<b id="hmaster">0</b></div><div class="stat">剩餘<b id="hleft">100 天</b></div></div><div class="bar"><i id="bar"></i></div></section>

// The original 3 are today's new core; 7 are spaced-review items selected deterministically.
const CORE_POOL=[...new Map(CUR.flatMap(d=>d.words).map(w=>[w.jp,w])).values()];
function makeExample(w){return {jp:`「${w.jp}」という言葉を使って、文を作ってみましょう。`,zh:`試著使用「${w.zh}」這個詞造一個句子。`}}
CUR.forEach((d,di)=>{
  const own=d.words.map(w=>({...w,...makeExample(w),kind:'今日核心'}));
  const used=new Set(own.map(w=>w.jp));
  const review=[]; let step=0;
  while(review.length<7 && step<CORE_POOL.length*2){
    const w=CORE_POOL[(di*17+step*11+29)%CORE_POOL.length]; step++;
    if(used.has(w.jp)) continue; used.add(w.jp);
    review.push({...w,...makeExample(w),kind:'間隔複習'});
  }
  d.words=[...own,...review];

function store(){localStorage.setItem(K,JSON.stringify(S))}function D(){return CUR[S.currentDay-1]}
function setDay(d){S.currentDay=Math.max(1,Math.min(100,+d));store();render()}
function render(){let d=S.currentDay,x=D(),s=S.days[d]||{};$("daySel").value=d;$("hday").textContent="Day "+d;$("dayBadge").textContent=`Day ${d} / 100`;$("theme").textContent="主題："+x.theme;$("todayWords").innerHTML=x.words.map((w,i)=>`<div class="note worditem" style="margin:9px 0"><div><span class="badge">${i+1} · ${esc(w.kind||'單字')}</span> <b style="font-size:20px">${esc(w.jp)}</b>（${esc(w.reading)}）— ${esc(w.zh)}</div><div class="example"><b>例句：</b>${esc(w.example||w.jp)}<br><span style="color:#64748b">${esc(w.exampleZh||'')}</span></div><div class="speakrow"><button class="speak" data-speak="${esc(w.jp)}" data-rate="1">🔊 單字</button><button class="speak slow" data-speak="${esc(w.jp)}" data-rate="0.75">🐢 慢速</button><button class="speak sentence" data-speak="${esc(w.example||w.jp)}" data-rate="0.9">🔊 例句</button></div></div>`).join("");$("task").textContent=x.task;$("customWord").value=s.customWord||"";$("note").value=s.note||"";$("saved").innerHTML=s.completed?`<b>Day ${d} 已儲存 ✓</b><br><br>單字 / 句子：<br>${esc(s.customWord||"未輸入")}<br><br>學習筆記：<br>${esc(s.note||"未輸入")}`:"尚未儲存。";$("prev").disabled=d===1;$("next").disabled=d===100;renderCards();renderGrammar();renderProgress();hero()}
function renderCards(){let x=D();$("flashcards").innerHTML=x.words.map((w,i)=>{let id=w.jp+"|"+w.reading,on=!!S.mastered[id];return `<div><div class="flash"><div class="inner"><div class="face"><div class="jp">${esc(w.jp)}</div><div class="rd">${esc(w.reading)}</div><small>${i+1}/10 · 點一下翻面</small></div><div class="face back"><div class="jp" style="font-size:21px">${esc(w.zh)}</div><div class="rd">${esc(w.reading)}</div><small style="margin-top:8px">${esc(w.example||"")}</small></div></div></div><div class="speakrow"><button class="speak" data-speak="${esc(w.jp)}" data-rate="1">🔊</button><button class="speak slow" data-speak="${esc(w.jp)}" data-rate="0.75">🐢</button><button class="speak sentence" data-speak="${esc(w.example||w.jp)}" data-rate="0.9">例句 🔊</button></div><button class="master ${on?"on":""}" data-id="${esc(id)}">${on?"✓ 已掌握":"標記已掌握"}</button></div>`}).join("");document.querySelectorAll(".flash").forEach(x=>x.onclick=()=>x.classList.toggle("flip"));document.querySelectorAll(".master").forEach(b=>b.onclick=()=>{S.mastered[b.dataset.id]?delete S.mastered[b.dataset.id]:S.mastered[b.dataset.id]=1;store();renderCards();hero()})}
function renderGrammar(){
 let g=D().grammar,s=S.days[S.currentDay]||{};
 $("grammarBox").innerHTML=`
 <div style="font-size:13px;font-weight:900;color:#2563eb;margin-bottom:8px">今日情境｜${esc(D().theme)}</div>
 <div class="pattern">${esc(g.pattern)}</div>
 <div class="note" style="margin-top:12px"><b>① 中文意思</b><p>${esc(g.meaning)}</p></div>
 <div class="note" style="margin-top:12px"><b>② 什麼時候使用？</b><p>${esc(g.why)}</p></div>
 <div class="note" style="margin-top:12px"><b>③ 句型公式</b><p><b>${esc(g.form)}</b></p></div>
 <div class="note" style="margin-top:12px"><b>④ 情境例句</b><p style="font-size:18px"><b>${esc(g.example)}</b><br><span style="color:#64748b">${esc(g.exampleZh)}</span></p><div class="speakrow"><button class="speak sentence" data-speak="${esc(g.example)}" data-rate="1">🔊 正常發音</button><button class="speak slow" data-speak="${esc(g.example)}" data-rate="0.75">🐢 慢速</button></div></div>
 <div class="note" style="margin-top:12px"><b>⑤ 今天怎麼學</b><p>理解中文 → 看公式 → 聽兩次 → 跟讀兩次 → 用今天的生活情境自己造一句。</p></div>`;
 $("sentence").value=s.sentence||""
}
function renderProgress(){let n=Object.keys(S.days).filter(k=>S.days[k]?.completed).length;$("progressText").textContent=`已完成 ${n} / 100 天，剩餘 ${100-n} 天。`;$("days").innerHTML=Array.from({length:100},(_,i)=>`<button class="day ${S.days[i+1]?.completed?"done":""}" data-d="${i+1}">${i+1}</button>`).join("");document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{setDay(b.dataset.d);tab("today")})}
function hero(){let n=Object.keys(S.days).filter(k=>S.days[k]?.completed).length;$("hdone").textContent=`${n} / 100`;$("hleft").textContent=`${100-n} 天`;$("hmaster").textContent=Object.keys(S.mastered).length;$("bar").style.width=n+"%"}
function quiz(){let x=D(),pool=CUR.flatMap(d=>d.words),qs=x.words.map(w=>{let o=[w.zh];while(o.length<4){let z=pool[Math.floor(Math.random()*pool.length)].zh;if(!o.includes(z))o.push(z)}return {q:`「${w.jp}」的中文意思是？`,a:w.zh,o:o.sort(()=>Math.random()-.5)}});let g=x.grammar,go=[g.zh];while(go.length<4){let z=CUR[Math.floor(Math.random()*100)].grammar.zh;if(!go.includes(z))go.push(z)}qs.push({q:`文法「${g.pattern}」的意思是？`,a:g.zh,o:go.sort(()=>Math.random()-.5)});qs.push({q:"今天的主題是？",a:x.theme,o:[...new Set([x.theme,"料理","運動","科技"])].slice(0,4).sort(()=>Math.random()-.5)});$("quizBox").innerHTML=qs.map((q,i)=>`<div style="margin-bottom:16px"><b>${i+1}. ${esc(q.q)}</b>${q.o.map(o=>`<button class="opt" data-i="${i}" data-a="${esc(q.a)}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`).join("");document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{let group=document.querySelectorAll(`[data-i="${b.dataset.i}"]`);group.forEach(x=>{x.disabled=true;if(x.dataset.o===x.dataset.a)x.classList.add("good")});if(b.dataset.o!==b.dataset.a)b.classList.add("bad")})}
function tab(id){document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===id));document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===id));if(id==="quiz")quiz()}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>tab(t.dataset.tab));
for(let i=1;i<=100;i++)$("daySel").add(new Option("Day "+i,i));$("prev").onclick=()=>setDay(S.currentDay-1);$("next").onclick=()=>setDay(S.currentDay+1);$("daySel").onchange=e=>setDay(e.target.value);
$("save").onclick=()=>{let d=S.currentDay;S.days[d]=Object.assign(S.days[d]||{},{customWord:$("customWord").value.trim(),note:$("note").value.trim(),completed:true,savedAt:new Date().toISOString()});store();render()};
$("saveSentence").onclick=()=>{let d=S.currentDay;S.days[d]=Object.assign(S.days[d]||{},{sentence:$("sentence").value.trim()});store();alert("例句已儲存")};$("newQuiz").onclick=quiz;
$("search").oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){$("results").innerHTML="";return}let a=CUR.flatMap(d=>d.words).filter((w,i,a)=>a.findIndex(z=>z.jp===w.jp)===i).filter(w=>(w.jp+w.reading+w.zh).toLowerCase().includes(q)).slice(0,30);$("results").innerHTML=a.map(w=>`<div class="note" style="margin:7px 0"><b>${esc(w.jp)}</b>（${esc(w.reading)}）— ${esc(w.zh)}</div>`).join("")||"找不到符合的生字。"};
$("exportBtn").onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="N3-100d-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);store();render();alert("匯入完成")}catch(x){alert("備份檔格式錯誤")}};r.readAsText(f)};$("resetBtn").onclick=()=>{if(confirm("確定清除全部 N3-100d 資料？")){localStorage.removeItem(K);location.reload()}};
function speakJP(text,rate=1){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀，請使用 Chrome、Edge 或 Safari。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=Number(rate)||1;let vs=speechSynthesis.getVoices(),v=vs.find(v=>v.lang==='ja-JP')||vs.find(v=>v.lang&&v.lang.startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-speak]');if(b){e.preventDefault();e.stopPropagation();speakJP(b.dataset.speak,b.dataset.rate)}});
load();setDay(S.currentDay);quiz();
</script></body></html>
