function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"null");if(x){S=x}}catch(e){}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dayObj(){return CUR[S.currentDay-1]}
function speak(text,rate){
 try{
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert("此瀏覽器目前無法使用語音。");return}
  window.speechSynthesis.cancel();
  var u=new window.SpeechSynthesisUtterance(String(text||""));u.lang="ja-JP";u.rate=rate||1;
  var vs=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[],v=null,i;
  for(i=0;i<vs.length;i++){if(vs[i].lang==="ja-JP"){v=vs[i];break}}
  if(!v){for(i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.indexOf("ja")===0){v=vs[i];break}}}
  if(v)u.voice=v;window.speechSynthesis.speak(u)
 }catch(e){alert("語音啟動失敗，請再點一次。")}
}
function setDay(n){n=parseInt(n,10);if(n<1)n=1;if(n>100)n=100;S.currentDay=n;store();render()}
function renderQuickDays(){
 var box=$("quickDays"),start=S.currentDay-3,end=S.currentDay+3,i,h="";
 if(start<1){end+=1-start;start=1} if(end>100){start-=end-100;end=100;if(start<1)start=1}
 for(i=start;i<=end;i++){
   h+='<button type="button" class="quickday '+(i===S.currentDay?"active":"")+'" data-qday="'+i+'">Day '+i+'</button>';
 }
 box.innerHTML=h;
}
function render(){
 var d=dayObj(),i,w,html="",done=0,master=0,k;
 $("daySel").value=S.currentDay;$("hday").innerHTML="Day "+S.currentDay;$("theme").innerHTML=esc(d.theme);$("task").innerHTML=esc(d.task);
 for(i=0;i<d.words.length;i++){w=d.words[i];html+='<div class="note worditem"><span class="badge">'+(i+1)+' · '+esc(w.kind)+'</span> <b>'+esc(w.jp)+'</b>（'+esc(w.reading)+'）— '+esc(w.zh)+'<div class="example"><b>例句：</b><div style="font-size:18px;font-weight:800;margin-top:5px">'+esc(w.example)+'</div><div style="color:#2563eb;margin-top:4px">'+esc(w.exampleReading||w.reading)+'</div><div style="color:#64748b;margin-top:4px">'+esc(w.exampleZh)+'</div></div><div class="speakrow"><button class="speak" data-speak="'+esc(w.jp)+'" data-rate="1">🔊 單字</button><button class="speak slow" data-speak="'+esc(w.jp)+'" data-rate="0.75">🐢 慢速</button><button class="speak" data-speak="'+esc(w.example)+'" data-rate="1">🔊 例句</button></div></div>'}
 $("todayWords").innerHTML=html;
 var sd=S.days[S.currentDay]||{};$("customWord").value=sd.customWord||"";$("note").value=sd.note||"";$("sentence").value=sd.sentence||"";$("saved").innerHTML=sd.completed?"已完成並儲存。":"尚未儲存。";
 for(k in S.days){if(S.days.hasOwnProperty(k)&&S.days[k].completed)done++}for(k in S.mastered){if(S.mastered.hasOwnProperty(k)&&S.mastered[k])master++}
 $("hdone").innerHTML=done+" / 100";$("hmaster").innerHTML=master;$("hleft").innerHTML=(100-done)+" 天";
 renderQuickDays();renderCards();renderGrammar();renderProgress();renderQuiz()
}
function renderCards(){
 var d=dayObj(),i,w,html="",on;
 for(i=0;i<d.words.length;i++){w=d.words[i];on=!!S.mastered[w.jp];html+='<div class="flash"><div class="jp">'+esc(w.jp)+'</div><div class="rd">'+esc(w.reading)+'</div><div>'+esc(w.zh)+'</div><div class="speakrow"><button class="speak" data-speak="'+esc(w.jp)+'" data-rate="1">🔊 發音</button><button class="speak slow" data-speak="'+esc(w.jp)+'" data-rate="0.75">🐢 慢速</button></div><button class="master '+(on?"on":"")+'" data-master="'+esc(w.jp)+'">'+(on?"✓ 已掌握":"標記已掌握")+'</button></div>'}
 $("flashcards").innerHTML=html
}
function renderGrammar(){
 var g=dayObj().grammar;
 $("grammarBox").innerHTML='<div class="pattern">'+esc(g.pattern)+'</div><div class="note"><b>① 中文意思</b><p>'+esc(g.meaning)+'</p></div><div class="note"><b>② 什麼時候使用？</b><p>'+esc(g.why)+'</p></div><div class="note"><b>③ 句型公式</b><p><b>'+esc(g.form)+'</b></p></div><div class="note"><b>④ 情境例句</b><p style="font-size:18px"><b>'+esc(g.example)+'</b><br>'+esc(g.exampleZh)+'</p><div class="speakrow"><button class="speak" data-speak="'+esc(g.example)+'" data-rate="1">🔊 正常發音</button><button class="speak slow" data-speak="'+esc(g.example)+'" data-rate="0.75">🐢 慢速</button></div></div><div class="note"><b>⑤ 今天怎麼學</b><p>理解中文 → 看公式 → 聽兩次 → 跟讀兩次 → 自己造一句。</p></div>'
}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function renderQuiz(){
 var d=dayObj(),i,w,opts,html="";
 for(i=0;i<3;i++){w=d.words[i];opts=[w.zh];while(opts.length<4){var z=d.words[Math.floor(Math.random()*d.words.length)].zh;if(opts.indexOf(z)<0)opts.push(z)}shuffle(opts);html+='<div class="note"><b>'+(i+1)+'. 「'+esc(w.jp)+'」的中文意思是？</b>';for(var j=0;j<opts.length;j++){html+='<button class="nav qopt" style="display:block;width:100%;margin-top:6px" data-a="'+esc(w.zh)+'" data-o="'+esc(opts[j])+'">'+esc(opts[j])+'</button>'}html+='</div>'}
 var g=d.grammar;html+='<div class="note"><b>4. '+esc(g.pattern)+' 最接近哪個意思？</b><p>'+esc(g.meaning)+'</p></div><div class="note"><b>5. 今天的主題是？</b><p>'+esc(d.theme)+'</p></div>';$("quizBox").innerHTML=html
}
function renderProgress(){var i,html="",done=0;for(i=1;i<=100;i++){var yes=S.days[i]&&S.days[i].completed;if(yes)done++;html+='<button class="day '+(yes?"done":"")+'" data-day="'+i+'">'+i+'</button>'}$("days").innerHTML=html;$("progressText").innerHTML="已完成 "+done+" / 100 天。"}
function tab(id){var ps=document.getElementsByClassName("panel"),ts=document.getElementsByClassName("tab"),i;for(i=0;i<ps.length;i++)ps[i].className="panel"+(ps[i].id===id?" active":"");for(i=0;i<ts.length;i++)ts[i].className="tab"+(ts[i].getAttribute("data-tab")===id?" active":"")}
document.onclick=function(e){e=e||window.event;var t=e.target||e.srcElement,sp=t.getAttribute&&t.getAttribute("data-speak"),m=t.getAttribute&&t.getAttribute("data-master"),dy=t.getAttribute&&t.getAttribute("data-day"),qd=t.getAttribute&&t.getAttribute("data-qday"),tb=t.getAttribute&&t.getAttribute("data-tab");if(sp){speak(sp,parseFloat(t.getAttribute("data-rate")||"1"));return}if(m){S.mastered[m]=!S.mastered[m];store();render();return}if(qd){setDay(qd);tab("today");return}if(dy){setDay(dy);tab("today");return}if(tb){tab(tb);return}};
for(var i=1;i<=100;i++){$("daySel").options[$("daySel").options.length]=new Option("Day "+i,i)}
$("daySel").onchange=function(){setDay(this.value)};
$("daySel").oninput=function(){setDay(this.value)};
$("prev").onclick=function(){setDay(S.currentDay-1)};
$("next").onclick=function(){setDay(S.currentDay+1)};
$("prev").ontouchend=function(e){if(e&&e.preventDefault)e.preventDefault();setDay(S.currentDay-1);return false};
$("next").ontouchend=function(e){if(e&&e.preventDefault)e.preventDefault();setDay(S.currentDay+1);return false};
$("save").onclick=function(){var d=S.currentDay;S.days[d]=S.days[d]||{};S.days[d].customWord=$("customWord").value;S.days[d].note=$("note").value;S.days[d].completed=true;store();render()};
$("saveSentence").onclick=function(){var d=S.currentDay;S.days[d]=S.days[d]||{};S.days[d].sentence=$("sentence").value;store();alert("例句已儲存")};
$("newQuiz").onclick=function(){renderQuiz()};
$("exportBtn").onclick=function(){try{var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="N3-100d-backup.json";a.click()}catch(e){alert("此瀏覽器無法直接匯出，請先用 Safari 開啟。")}};
$("importFile").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=JSON.parse(r.result);store();render();alert("匯入完成")}catch(e){alert("備份格式錯誤")}};r.readAsText(f)};
$("resetBtn").onclick=function(){if(confirm("確定清除全部資料？")){try{localStorage.removeItem(KEY)}catch(e){};location.reload()}};
try{load();render()}catch(err){document.body.innerHTML='<div style="padding:24px;font-family:Arial"><h2>N3-100d 載入失敗</h2><pre>'+esc(err)+'</pre></div>'}
</script>
</body></html>
