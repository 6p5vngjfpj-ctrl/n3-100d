var KEY="n3-100d-v73";
var S={currentDay:1,days:{},mastered:{}};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"null");if(x){S=x}}catch(e){}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dayObj(){return CUR[S.currentDay-1]}
function speak(text,rate){
 try{
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert("此瀏覽器目前無法使用語音。");return}
  window.speechSynthesis.cancel();
  var u=new window.SpeechSynthesisUtterance(String(text||""));u.lang="ja-JP";u.rate=rate||1;
  var vs=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[],v=null,i;
  for(i=0;i<vs.length;i++){if(vs[i].lang==="ja-JP"){v=vs[i];break}}
  if(!v){for(i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.indexOf("ja")===0){v=vs[i];break}}}
  if(v)u.voice=v;window.speechSynthesis.speak(u)
 }catch(e){alert("語音啟動失敗，請再點一次。")}
}
function setDay(n){n=parseInt(n,10);if(n<1)n=1;if(n>100)n=100;S.currentDay=n;store();render()}
function render(){
 var d=dayObj(),i,w,html="",done=0,master=0,k;
 $("daySel").value=S.currentDay;$("hday").innerHTML="Day "+S.currentDay;$("theme").innerHTML=esc(d.theme);$("task").innerHTML=esc(d.task);
 for(i=0;i<d.words.length;i++){w=d.words[i];html+='<div class="note worditem"><span class="badge">'+(i+1)+' · '+esc(w.kind)+'</span> <b>'+esc(w.jp)+'</b>（'+esc(w.reading)+'）— '+esc(w.zh)+'<div class="example"><b>例句：</b>'+esc(w.example)+'<br><span style="color:#64748b">'+esc(w.exampleZh)+'</span></div><div class="speakrow"><button class="speak" data-speak="'+esc(w.jp)+'" data-rate="1">🔊 單字</button><button class="speak slow" data-speak="'+esc(w.jp)+'" data-rate="0.75">🐢 慢速</button><button class="speak" data-speak="'+esc(w.example)+'" data-rate="1">🔊 例句</button></div></div>'}
 $("todayWords").innerHTML=html;
 var sd=S.days[S.currentDay]||{};$("customWord").value=sd.customWord||"";$("note").value=sd.note||"";$("sentence").value=sd.sentence||"";$("saved").innerHTML=sd.completed?"已完成並儲存。":"尚未儲存。";

 renderCards();renderGrammar();renderProgress();renderQuiz()
}

}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function renderQuiz(){

 var g=d.grammar;html+='<div class="note"><b>4. '+esc(g.pattern)+' 最接近哪個意思？</b><p>'+esc(g.meaning)+'</p></div><div class="note"><b>5. 今天的主題是？</b><p>'+esc(d.theme)+'</p></div>';$("quizBox").innerHTML=html
