$("exportBtn").onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="N3-100d-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);store();render();alert("匯入完成")}catch(x){alert("備份檔格式錯誤")}};r.readAsText(f)};$("resetBtn").onclick=()=>{if(confirm("確定清除全部 N3-100d 資料？")){localStorage.removeItem(K);location.reload()}};
