<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>N3-100d</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",Arial,sans-serif;background:#f5f7fb;color:#1f2937}
    #loader{max-width:720px;margin:18vh auto;padding:28px;text-align:center}
    #loader .box{background:#fff;border-radius:22px;padding:28px;box-shadow:0 8px 28px #00000012}
    #loader h1{margin:0 0 10px;font-size:28px}
    #loader p{color:#64748b;line-height:1.7}
  </style>
</head>
<body>
<div id="loader">
  <div class="box">
    <h1>N3-100d</h1>
    <p>正在載入 100 天課程與日文發音功能…</p>
  </div>
</div>

<script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/6p5vngjfpj-ctrl/n3-100d/9ce99d70a1254004f0060c483b77e343e3ccf920/index.html';

  const speechCSS=`<style id="n3-speech-style">
    .n3-speech-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    .n3-speech-btn{border:0;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:800;background:#dbeafe;color:#1d4ed8;cursor:pointer;line-height:1.2}
    .n3-speech-btn.slow{background:#f1f5f9;color:#475569}
    .n3-speech-btn:active{transform:scale(.98)}
  </style>`;

  const speechJS=`<script id="n3-speech-script">
  (()=>{
    let jaVoice=null;

    function chooseVoice(){
      if(!('speechSynthesis' in window)) return null;
      const voices=speechSynthesis.getVoices();
      jaVoice=
        voices.find(v=>String(v.lang).toLowerCase()==='ja-jp') ||
        voices.find(v=>String(v.lang).toLowerCase().startsWith('ja')) ||
        null;
      return jaVoice;
    }

    if('speechSynthesis' in window){
      chooseVoice();
      speechSynthesis.onvoiceschanged=chooseVoice;
    }

    window.n3SpeakJP=(text,rate=1)=>{
      if(!text)return;
      if(!('speechSynthesis' in window)){
        alert('此瀏覽器不支援語音朗讀。請使用 Safari、Chrome 或 Edge。');
        return;
      }
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang='ja-JP';
      u.rate=Number(rate)||1;
      u.pitch=1;
      u.volume=1;
      const v=chooseVoice();
      if(v)u.voice=v;
      speechSynthesis.speak(u);
    };

    function buttons(text){
      const row=document.createElement('div');
      row.className='n3-speech-row';

      const normal=document.createElement('button');
      normal.type='button';
      normal.className='n3-speech-btn';
      normal.textContent='🔊 正常發音';
      normal.dataset.n3Speak=text;
      normal.dataset.rate='1';

      const slow=document.createElement('button');
      slow.type='button';
      slow.className='n3-speech-btn slow';
      slow.textContent='🐢 慢速 0.75×';
      slow.dataset.n3Speak=text;
      slow.dataset.rate='0.75';

      row.append(normal,slow);
      return row;
    }

    function enhance(){
      const d=(typeof D==='function')?D():null;

      if(d && d.words){
        const today=document.getElementById('todayWords');
        if(today){
          [...today.children].forEach((el,i)=>{
            if(d.words[i] && !el.querySelector('.n3-speech-row')){
              el.appendChild(buttons(d.words[i].jp));
            }
          });
        }

        const cards=document.getElementById('flashcards');
        if(cards){
          [...cards.children].forEach((wrap,i)=>{
            if(d.words[i] && !wrap.querySelector('.n3-speech-row')){
              const row=buttons(d.words[i].jp);
              const master=wrap.querySelector('.master');
              master ? wrap.insertBefore(row,master) : wrap.appendChild(row);
            }
          });
        }

        const grammar=document.getElementById('grammarBox');
        if(grammar && d.grammar && d.grammar.example && !grammar.querySelector('.n3-speech-row')){
          grammar.appendChild(buttons(d.grammar.example));
        }
      }

      const results=document.getElementById('results');
      if(results){
        [...results.children].forEach(el=>{
          if(el.querySelector('.n3-speech-row'))return;
          const b=el.querySelector('b');
          if(b && b.textContent.trim()){
            el.appendChild(buttons(b.textContent.trim()));
          }
        });
      }
    }

    document.addEventListener('click',e=>{
      const b=e.target.closest('[data-n3-speak]');
      if(!b)return;
      e.preventDefault();
      e.stopPropagation();
      window.n3SpeakJP(b.dataset.n3Speak,b.dataset.rate);
    },true);

    let queued=false;
    const schedule=()=>{
      if(queued)return;
      queued=true;
      requestAnimationFrame(()=>{
        queued=false;
        enhance();
      });
    };

    const mo=new MutationObserver(schedule);
    mo.observe(document.body,{subtree:true,childList:true});

    window.addEventListener('load',schedule);
    setTimeout(schedule,0);
    setTimeout(schedule,400);
    setTimeout(schedule,1200);
  })();
<\/script>`;

  try{
    const r=await fetch(BASE,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);

    let html=await r.text();
    html=html.replace('</head>',speechCSS+'</head>');
    html=html.replace('</body>',speechJS+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loader').innerHTML=
      '<div class="box"><h1>載入失敗</h1><p>無法取得課程資料。請確認網路後重新整理。<br>'+String(err)+'</p></div>';
  }
})();
</script>
</body>
</html>
