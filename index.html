<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3-100d</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .header p {
      margin: 0;
      color: #64748b;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:active {
      transform: scale(0.99);
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e2e8f0;
      font-size: 14px;
      margin-bottom: 12px;
    }

    footer {
      text-align: center;
      padding: 20px 0 30px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>N3-100d</h1>
      <p>Japanese N3 · 100 Day Learning System</p>
    </header>

    <section class="card">
      <span class="status">Day 1 / 100</span>

      <h2>今日學習</h2>

      <div class="input-group">
        <label for="day">學習天數</label>
        <select id="day">
          <option value="1">Day 1</option>
          <option value="2">Day 2</option>
          <option value="3">Day 3</option>
          <option value="4">Day 4</option>
          <option value="5">Day 5</option>
        </select>
      </div>

      <div class="input-group">
        <label for="word">日文單字 / 句子</label>
        <input
          id="word"
          type="text"
          placeholder="例如：勉強します"
        >
      </div>

      <div class="input-group">
        <label for="note">學習筆記</label>
        <textarea
          id="note"
          placeholder="輸入今天的文法、單字或例句..."
        ></textarea>
      </div>

      <button onclick="saveStudy()">
        儲存今日學習
      </button>

      <div id="result" class="result">
        尚未輸入學習內容。
      </div>
    </section>

    <section class="card">
      <h2>100 天目標</h2>

      <p>
        每天持續累積 N3 單字、文法、閱讀與聽力，
        建立完整的 100 天學習紀錄。
      </p>
    </section>

    <footer>
      N3-100d Learning Project
    </footer>

  </div>

  <script>
    function saveStudy() {

      const day =
        document.getElementById("day").value;

      const word =
        document.getElementById("word").value.trim();

      const note =
        document.getElementById("note").value.trim();

      const result =
        document.getElementById("result");

      if (!word && !note) {
        result.textContent =
          "請先輸入今天的學習內容。";
        return;
      }

      const data = {
        day: day,
        word: word,
        note: note,
        savedAt: new Date().toISOString()
      };

      localStorage.setItem(
        "n3-100d-day-" + day,
        JSON.stringify(data)
      );

      result.textContent =
        "Day " + day +
        " 已儲存 ✓\n\n" +
        "單字 / 句子：\n" +
        (word || "未輸入") +
        "\n\n學習筆記：\n" +
        (note || "未輸入");
    }
  </script>

</body>
</html>
